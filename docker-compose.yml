services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shop-php
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shop-network

  nginx:
    image: nginx:1.27-alpine
    container_name: shop-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - shop-network

  db:
    image: mysql:8.0
    container_name: shop-db
    environment:
      MYSQL_DATABASE: shopstack
      MYSQL_USER: shop
      MYSQL_PASSWORD: shop_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - shop-db-data:/var/lib/mysql
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: shop-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true
    networks:
      - shop-network

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: shop-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - shop-network

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: shop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - shop-network

  grafana:
    image: grafana/grafana:12.2.0
    container_name: shop-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - shop-network
networks:
  shop-network:

volumes:
  shop-db-data:
  prometheus-data:
  grafana-data: